server.port=8080
spring.application.name=redavo-pos

spring.config.import=optional:file:.env[.properties]

# ─── Active profile ──────────────────────────────────────────────
# Override with -Dspring.profiles.active=staging|production
spring.profiles.active=${APP_PROFILE:local}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# ─── Swagger/OpenAPI ──────────────────────────────────────────────
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# ─── PostgreSQL Database (Red_Avo on pgAdmin4) ───────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/Red_Avo
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# ─── Hibernate / Spring JPA ──────────────────────────────────────
# 'validate' = Hibernate checks that DB columns match @Entity fields.
# Schema is now managed exclusively by Flyway migrations.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ─── Flyway Migrations ──────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Since we are moving from Hibernate to Flyway and have dummy data,
# we tell Flyway to baseline the existing schema as version 0.
# This allows V1 (which contains DROP TABLE statements) to run and wipe it cleanly.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ─── JWT ─────────────────────────────────────────────────────────
# Generate a strong secret with: openssl rand -base64 64
app.jwt.secret=${JWT_SECRET}
# Token validity in milliseconds (24 hours = 86400000)
app.jwt.expiration-ms=${JWT_EXPIRY_MS:86400000}

# ─── Admin Registration Gate ────────────────────────────────────
# Super-password required to create the first ADMIN account.
# Override with SUPER_PASSWORD env var in production (use something strong).
app.auth.super-password=${SUPER_PASSWORD}

# ─── Admin Order Alerts ───────────────────────────────────────────
# Set these to receive an email/SMS notification on every new order.
# Leave blank (default) to disable — do NOT hardcode values here.
app.admin.notify-email=${ADMIN_NOTIFY_EMAIL:}
app.admin.notify-phone=${ADMIN_NOTIFY_PHONE:}

# ─── Seed data gate ──────────────────────────────────────────────
# Set SEED_ENABLED=false in production to prevent demo data loading.
app.seed.enabled=${SEED_ENABLED:true}

# ─── Gmail SMTP (Google App Password) ────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:gilesbvuma14@gmail.com}
# Google App Password — spaces removed (required by JavaMail)
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ─── Meta WhatsApp Cloud API ─────────────────────────────────────
meta.whatsapp.phone.number.id=${META_PHONE_NUMBER_ID}
meta.whatsapp.access.token=${META_ACCESS_TOKEN}
meta.whatsapp.api.version=v19.0

# ─── Notification Mode ────────────────────────────────────────────
notification.demo.mode=false

# ─── File Upload ──────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Where uploaded product images are saved. Relative to backend/ working dir.
# Set UPLOAD_DIR to an absolute path in staging/production.
app.upload.dir=${UPLOAD_DIR:../frontend/apps/pos-web/public/uploads}
