server.port=8080
spring.application.name=redavo-pos

# ─── Active profile ──────────────────────────────────────────────
# Override with -Dspring.profiles.active=staging|production
spring.profiles.active=${APP_PROFILE:local}

# ─── PostgreSQL Database (Red_Avo on pgAdmin4) ───────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/Red_Avo
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:T@diwanashe17}

# ─── Hibernate / Spring JPA ──────────────────────────────────────
# 'validate' = Hibernate checks that DB columns match @Entity fields.
# Schema is now managed exclusively by Flyway migrations.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ─── Flyway Migrations ──────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Since we are moving from Hibernate to Flyway and have dummy data,
# we tell Flyway to baseline the existing schema as version 0.
# This allows V1 (which contains DROP TABLE statements) to run and wipe it cleanly.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ─── JWT ─────────────────────────────────────────────────────────
# Generate a strong secret with: openssl rand -base64 64
app.jwt.secret=${JWT_SECRET:4E6J4FkiQr2VhBxWu9sYmP3nLqDpZzCgXoRvTwAeMs8UbGcKyHd1lN0jOfi5tWn}
# Token validity in milliseconds (24 hours = 86400000)
app.jwt.expiration-ms=${JWT_EXPIRY_MS:86400000}

# ─── Seed data gate ──────────────────────────────────────────────
# Set SEED_ENABLED=false in production to prevent demo data loading.
app.seed.enabled=${SEED_ENABLED:true}

